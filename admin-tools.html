<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etkinlik Toplu Yükleme — Dülük Hub</title>
<meta name="robots" content="noindex, nofollow">
<style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #0A0E14; color: #e5e7eb; margin: 0; padding: 24px; }
    .card { max-width: 720px; margin: 0 auto; background: #111820; border: 1px solid #1f2937; border-radius: 14px; padding: 24px; }
    h1 { font-size: 20px; color: #06B6D4; margin: 0 0 6px; }
    p.sub { color: #9ca3af; margin: 0 0 18px; font-size: 13px; }
    .btn-row { display: flex; gap: 10px; }
    button { background: #06B6D4; color: #04262b; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #1f2937; color: #e5e7eb; }
    button.danger { background: #7f1d1d; color: #fecaca; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 13px; line-height: 1.7; }
    .ok { color: #34d399; }
    .err { color: #f87171; }
    .info { color: #93c5fd; }
</style>
</head>
<body>
<div class="card">
    <h1>Yönetim Araçları</h1>
    <p class="sub" id="authInfo">Oturum kontrol ediliyor...</p>
    <div class="btn-row">
        <button id="storyBtn" type="button">Tarihi Eserleri Hikaye Yap</button>
        <button id="cleanupBtn" class="secondary" type="button">Konser Hikayelerini Temizle</button>
        <button id="backBtn" class="danger" type="button">Panele Dön</button>
    </div>
    <div id="status"></div>
</div>
<script type="module" src="./js/admin-tools.js"></script>
</body>
</html>
